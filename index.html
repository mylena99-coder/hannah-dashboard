<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별 모으는 하루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* Layout idea: the sky behind the page follows the real time of day (sunrise / daylight / night);
   one big routine card on the left, the "what I earned" shelf on the right. Single visual world, no light/dark switch. */
:root{
  --sky-a:#FFE3CF; --sky-b:#CFE6FF;
  --ink:#2A2850; --ink-soft:#6B6A8C;
  --card:#FFFFFF; --card-2:#F4F3FB; --line:#E3E1F2;
  --accent:#FF7A59; --accent-ink:#FFFFFF;
  --star:#FFC22E; --star-ink:#4A3200;
  --done:#2FA872;
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:22px;
  color-scheme:light;
}
:root[data-phase="after"]{
  --sky-a:#BDE5FF; --sky-b:#E6F7D6;
  --ink:#15324C; --ink-soft:#557089;
  --card-2:#EEF6FB; --line:#D5E6F0;
  --accent:#1479C9;
}
:root[data-phase="night"]{
  --sky-a:#17163F; --sky-b:#3B2B6E;
  --ink:#F4F1FF; --ink-soft:#B9B3DE;
  --card:#2A2861; --card-2:#35326F; --line:#48458A;
  --accent:#B59BFF; --accent-ink:#1B1840;
  --done:#6FE0A8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:var(--font-body); font-size:17px; line-height:1.5;
  background:linear-gradient(180deg,var(--sky-a),var(--sky-b)) fixed var(--sky-b);
  transition:color .6s;
}
:root[data-phase="night"] body{
  background:
    radial-gradient(2px 2px at 12% 18%,#fff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 31% 9%,#fff 50%,transparent 51%),
    radial-gradient(2px 2px at 57% 22%,#fff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 78% 12%,#fff 50%,transparent 51%),
    radial-gradient(2px 2px at 91% 30%,#fff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 44% 38%,#fff 50%,transparent 51%),
    linear-gradient(180deg,var(--sky-a),var(--sky-b));
  background-attachment:fixed; background-color:var(--sky-b);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}

.wrap{max-width:1320px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.orb{width:58px;height:58px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 35%,#FFF3B0,#FFC22E 70%);
  box-shadow:0 0 0 8px rgba(255,194,46,.22)}
:root[data-phase="night"] .orb{background:radial-gradient(circle at 35% 35%,#fff,#E7E2FF 70%);
  box-shadow:inset -14px -6px 0 0 #C9C0F5,0 0 0 8px rgba(255,255,255,.08)}
.hello{flex:1 1 240px;min-width:0}
.hello h1{font-size:clamp(26px,5vw,36px);line-height:1.15}
.hello p{margin:2px 0 0;color:var(--ink-soft)}
.meters{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.meter{background:var(--card);border-radius:18px;padding:8px 16px;display:flex;flex-direction:column;justify-content:center;min-width:92px}
.meter b{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.meter span{font-size:13px;color:var(--ink-soft)}
.meter.star{background:var(--star);color:var(--star-ink)}
.meter.star span{color:var(--star-ink);opacity:.75}
.gear{border:0;background:var(--card);border-radius:18px;padding:0 16px;min-height:56px;font-size:15px}

.note{background:var(--card);border-radius:var(--r);padding:12px 18px;display:flex;gap:10px;align-items:baseline}
.note small{font-family:var(--font-display);color:var(--accent);flex:none;font-size:15px}
.note p{margin:0;overflow-wrap:anywhere}

/* main grid */
.grid{display:grid;gap:18px;align-items:start;grid-template-columns:minmax(0,1fr);grid-template-areas:"r" "a" "b"}
.grid>.routine{grid-area:r}.grid>.shelf.a{grid-area:a}.grid>.shelf.b{grid-area:b}
@media (min-width:760px){.grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-areas:"r a" "r b"}}
@media (min-width:980px){.grid{grid-template-columns:minmax(0,1.2fr) minmax(0,.95fr) minmax(0,.95fr);grid-template-areas:"r a b"}}
@media (min-width:980px) and (max-height:820px){
  .wrap{padding-top:12px;gap:12px}.grid{gap:14px}.shelf{gap:14px}.card{padding:14px}
  .orb{width:44px;height:44px}.note{padding:8px 16px}.task{min-height:58px;padding:9px 12px}.tasks{gap:8px}
}

/* weather */
.wx-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.wx-top h2{margin:0}.wx-top small{color:var(--ink-soft);font-size:13px;text-align:right}
.wx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wx div{background:var(--card-2);border-radius:16px;padding:10px 12px;min-width:0}
.wx .lb{font-size:13px;color:var(--ink-soft);display:block}
.wx .big{font-family:var(--font-display);font-size:28px;line-height:1.15;display:block;font-variant-numeric:tabular-nums}
.wx .sm{font-size:14px;display:block;font-variant-numeric:tabular-nums}
.wear{margin:10px 0 0;border:2px dashed var(--star);border-radius:14px;padding:8px 12px;font-size:15px}
.wear b{font-family:var(--font-display);font-weight:400;color:var(--accent)}
.card{background:var(--card);border-radius:var(--r);padding:18px;min-width:0}
.card h2{font-size:21px;margin-bottom:10px}
.shelf{display:flex;flex-direction:column;gap:18px;min-width:0}

/* routine tabs */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.tab{border:2px solid var(--line);background:var(--card-2);border-radius:16px;padding:10px 8px;text-align:center;min-width:0}
.tab .nm{font-family:var(--font-display);font-size:17px;display:block}
.tab .ct{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--card)}
.tab.full{border-color:var(--done)}
.tab.full .ct{color:var(--done)}
.tab .now{display:inline-block;font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px;margin-left:4px;vertical-align:2px}

.bar{height:14px;border-radius:99px;background:var(--card-2);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--star);transition:width .35s}

.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  border:2px solid var(--line);background:var(--card);border-radius:18px;padding:12px 14px;min-height:66px}
.task .em{font-size:30px;line-height:1;flex:none;width:38px;text-align:center}
.task .tx{flex:1;min-width:0;font-size:19px;overflow-wrap:anywhere}
.task .ck{flex:none;width:38px;height:38px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:20px;color:transparent}
.task[aria-pressed="true"]{background:var(--card-2);border-color:transparent}
.task[aria-pressed="true"] .tx{color:var(--ink-soft);text-decoration:line-through}
.task[aria-pressed="true"] .ck{background:var(--star);border-color:var(--star);color:var(--star-ink)}
.task.pop .ck{animation:pop .4s}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.cheer{margin:14px 0 0;font-family:var(--font-display);font-size:18px;color:var(--done)}
.rule{margin:12px 0 0;font-size:14px;color:var(--ink-soft)}
.empty{color:var(--ink-soft);margin:0}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--card-2);border-radius:14px;padding:8px 2px;text-align:center;border:2px solid transparent}
.day.today{border-color:var(--accent);background:var(--card)}
.day b{display:block;font-family:var(--font-display);font-weight:400;font-size:15px}
.dots{display:flex;justify-content:center;gap:3px;margin-top:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--star)}
.legend{margin:10px 0 0;font-size:13px;color:var(--ink-soft)}

/* friends */
.friends{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.fr{aspect-ratio:1;border-radius:16px;background:var(--card-2);display:grid;place-items:center;text-align:center;padding:2px;min-width:0}
.fr .e{font-size:clamp(22px,6vw,30px);line-height:1}
.fr .n{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fr.lock .e{opacity:.35;font-family:var(--font-display);font-size:22px}
.fr.new{animation:pop .5s}
.sub{margin:0 0 10px;color:var(--ink-soft);font-size:15px}

/* shop */
.shop{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rw{display:flex;align-items:center;gap:10px;background:var(--card-2);border-radius:16px;padding:10px 12px}
.rw .em{font-size:26px;flex:none}
.rw .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.rw .tx small{display:block;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:14px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-size:16px;flex:none;min-height:44px}
.btn[disabled]{background:var(--line);color:var(--ink-soft);cursor:default}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.warn{background:#D8483C;color:#fff}
.coupons{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.coupons li{border:2px dashed var(--star);border-radius:14px;padding:8px 12px;font-size:15px;overflow-wrap:anywhere}

.foot{text-align:center;color:var(--ink-soft);font-size:13px;margin:0}

[hidden]{display:none!important}
:root{--miss:#D8483C}
:root[data-phase="night"]{--miss:#FF9A8F}

/* page switcher */
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav button{border:0;background:var(--card);border-radius:99px;padding:10px 20px;font-family:var(--font-display);font-size:18px;min-height:48px;opacity:.75}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);opacity:1}
.nav small{font-family:var(--font-body);font-size:13px;margin-left:6px;font-variant-numeric:tabular-nums}
.solo{max-width:720px;width:100%;margin:0 auto}

/* homework */
.hw{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hw li{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.hw li.full{background:var(--card-2);border-color:transparent}
.hw .em{font-size:30px;flex:none;width:38px;text-align:center}
.hw .tx{flex:1 1 150px;min-width:0;font-size:19px;overflow-wrap:anywhere}
.hw .tx small{display:block;font-size:14px;color:var(--ink-soft)}
.bubs{display:flex;gap:6px;flex-wrap:wrap}
.bub{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);background:transparent;color:transparent;font-size:20px;padding:0}
.bub[aria-pressed="true"]{background:var(--star);border-color:var(--star);color:var(--star-ink)}

/* quiz */
.subs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.subs{grid-template-columns:minmax(0,1fr)}}
.sub-btn{border:2px solid var(--line);background:var(--card-2);border-radius:20px;padding:18px 12px;text-align:center}
.sub-btn .e{font-size:38px;display:block;line-height:1.2}
.sub-btn .nm{font-family:var(--font-display);font-size:22px;display:block}
.sub-btn .st{font-size:14px;color:var(--ink-soft)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--ink-soft)}
.qtext{font-size:clamp(21px,4.5vw,27px);line-height:1.4;margin:6px 0 18px;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px;font-size:20px;min-height:64px;text-align:center;overflow-wrap:anywhere}
.opt.right{border-color:var(--done);background:var(--card-2);box-shadow:inset 0 0 0 2px var(--done)}
.opt.wrong{border-color:var(--miss);color:var(--miss)}
.opt[disabled]{cursor:default}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;min-height:48px}
.qfoot p{margin:0;font-family:var(--font-display);font-size:19px}
.qfoot p.ok{color:var(--done)} .qfoot p.no{color:var(--miss)}
.result{text-align:center;padding:10px 0}
.result .big{font-family:var(--font-display);font-size:54px;line-height:1.1;font-variant-numeric:tabular-nums}
.result p{margin:6px 0 16px}
.result .row{justify-content:center}

/* toast + fx */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;
  background:var(--ink);color:var(--sky-b);font-family:var(--font-display);font-size:18px;border-radius:99px;padding:12px 22px;
  max-width:calc(100% - 32px);text-align:center;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* dialogs */
dialog{border:0;border-radius:24px;padding:0;background:var(--card);color:var(--ink);width:min(640px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,10,40,.55)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:18px}
.dlg header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg h2{font-size:24px}
.dlg h3{font-size:18px;margin-bottom:8px}
.dlg section{border-top:2px solid var(--line);padding-top:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.row label{font-size:14px;color:var(--ink-soft);flex:0 0 100%}
.in{border:2px solid var(--line);background:var(--card-2);border-radius:12px;padding:9px 10px;min-width:0}
.in.e{width:56px;text-align:center;flex:none}
.in.t{flex:1 1 140px}
.in.c{width:76px;flex:none;text-align:right}
.x{border:0;background:transparent;font-size:20px;width:40px;height:40px;border-radius:10px;flex:none}
.hint{font-size:14px;color:var(--ink-soft);margin:0 0 8px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="orb" aria-hidden="true"></div>
    <div class="hello"><h1 id="hi"></h1><p id="date"></p></div>
    <div class="meters">
      <div class="meter star"><b id="mStar">0</b><span>모은 별</span></div>
      <div class="meter"><b id="mStreak">0</b><span>일 연속</span></div>
      <button class="gear" id="openParent" type="button">부모님 메뉴</button>
    </div>
  </header>
  <div class="note" id="noteBox"><small>오늘의 한마디</small><p id="note"></p></div>

  <nav class="nav" id="nav" aria-label="화면 고르기"></nav>

  <section class="card solo" id="viewHw" hidden>
    <h2>이번 주 숙제</h2>
    <p class="sub" id="hwSub"></p>
    <div class="bar" aria-hidden="true"><i id="hwFill" style="width:0"></i></div>
    <ul class="hw" id="hwList"></ul>
    <p class="rule">동그라미 하나에 별 1개 · 이번 주 숙제를 전부 하면 별 5개 더 · 월요일마다 새로 시작해요</p>
  </section>

  <section class="card solo" id="viewQuiz" hidden>
    <div id="quizBody"></div>
  </section>

  <main class="grid" id="viewToday">
    <section class="card routine" aria-label="오늘 할 일">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="bar" aria-hidden="true"><i id="barFill" style="width:0"></i></div>
      <ul class="tasks" id="tasks"></ul>
      <p class="cheer" id="cheer" hidden></p>
      <p class="rule">하나 하면 별 1개 · 한 묶음을 다 하면 별 2개 더 · 세 묶음을 다 하면 별 3개 더</p>
    </section>

    <div class="shelf a">
      <section class="card" id="wxCard" hidden>
        <div class="wx-top"><h2>날씨</h2><small id="wxAt"></small></div>
        <div class="wx" id="wx"></div>
        <p class="wear" id="wear"></p>
      </section>
      <section class="card"><h2>이번 주</h2><div class="week" id="week"></div>
        <p class="legend">점 세 개는 아침 · 학교 다녀와서 · 자기 전이에요. 다 하면 노랗게 켜져요.</p></section>
    </div>
    <div class="shelf b">
      <section class="card"><h2>별 친구들</h2><p class="sub" id="frSub"></p>
        <div class="bar" aria-hidden="true"><i id="frFill" style="width:0"></i></div>
        <div class="friends" id="friends"></div></section>
      <section class="card"><h2>별 가게</h2><ul class="shop" id="shop"></ul><ul class="coupons" id="coupons"></ul></section>
    </div>
  </main>
  <p class="foot" id="sync"></p>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="gate"><form class="dlg" id="gateForm">
  <header><h2>부모님 확인</h2><button class="x" type="button" id="gateClose" aria-label="닫기">✕</button></header>
  <div class="row"><label for="gateAns" id="gateQ"></label>
    <input class="in t" id="gateAns" inputmode="numeric" autocomplete="off">
    <button class="btn" type="submit">확인</button></div>
</form></dialog>

<dialog id="parent"><div class="dlg" id="parentBody"></div></dialog>

<script>
(function(){
"use strict";
var ROUTINES=[{k:"morning",nm:"아침"},{k:"after",nm:"학교 다녀와서"},{k:"night",nm:"자기 전"}];
var FRIENDS=[["🐰","토토"],["🐥","삐약이"],["🐱","나비"],["🐶","콩이"],["🦊","여울이"],["🐼","동글이"],["🐨","코코"],["🦁","으뜸이"],["🐯","호야"],["🐸","폴짝이"],
  ["🐧","뒤뚱이"],["🦉","부엉이"],["🐢","느긋이"],["🐬","물보라"],["🦄","무지개"],["🐳","푸푸"],["🦋","팔랑이"],["🐝","붕붕이"],["🦕","초록이"],["🐉","반짝이"]];
var DAYS_KO=["일","월","화","수","목","금","토"];

function uid(){return Math.random().toString(36).slice(2,9)}
function T(e,t){return {id:uid(),e:e,t:t}}
var SUBJ=[{k:"en",nm:"영어",e:"🔤"},{k:"ko",nm:"국어",e:"📚"},{k:"ma",nm:"수학",e:"🔢"}];
/* quiz banks: [question, correct answer, wrong, wrong, wrong] */
var BANK_EN=[
["Which word means the same as \"enormous\"?","huge","tiny","quiet","quick"],
["Which word is the opposite of \"ancient\"?","modern","old","dusty","famous"],
["If you are \"exhausted\", you are…","very tired","very hungry","very happy","very late"],
["If you are \"curious\", you…","want to know more","want to go to sleep","feel a little sick","are very strong"],
["Which word means the same as \"furious\"?","very angry","very funny","very fast","very sleepy"],
["To \"glance\" at something means to…","look at it quickly","throw it away","break it","draw it"],
["To \"whisper\" means to…","speak very quietly","shout loudly","sing a song","run away"],
["Which word means the same as \"brave\"?","courageous","careless","clumsy","cranky"],
["Which word means the same as \"delicious\"?","tasty","salty","messy","chilly"],

function normalize(s){
  var d=defaults(); if(!s||typeof s!=="object") return d;
  var c=s.cfg&&typeof s.cfg==="object"?s.cfg:{};
  d.cfg.name=typeof c.name==="string"&&c.name&&c.name!=="우리 딸"?c.name:d.cfg.name;
  if(Array.isArray(c.hw)) d.cfg.hw=c.hw.filter(function(t){return t&&t.id}).map(function(t){return {id:String(t.id),e:String(t.e||"📘"),t:String(t.t||""),n:Math.min(7,Math.max(1,Math.round(+t.n)||1))}});
  if(s.weeks&&typeof s.weeks==="object") Object.keys(s.weeks).forEach(function(k){
    var x=s.weeks[k]; if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!x) return;
    d.weeks[k]={c:x.c&&typeof x.c==="object"?x.c:{},stars:+x.stars||0,full:!!x.full};
  });
  d.cfg.note=typeof c.note==="string"?c.note:d.cfg.note;
  d.cfg.city=typeof c.city==="string"&&c.city?c.city:"서울";
  d.cfg.unlockEvery=[10,15,20,30].indexOf(c.unlockEvery)>=0?c.unlockEvery:15;
  if(c.tasks&&typeof c.tasks==="object") ROUTINES.forEach(function(r){
    if(Array.isArray(c.tasks[r.k])) d.cfg.tasks[r.k]=c.tasks[r.k].filter(function(t){return t&&t.id}).map(function(t){return {id:String(t.id),e:String(t.e||"⭐"),t:String(t.t||"")}});
  });
  if(Array.isArray(c.rewards)) d.cfg.rewards=c.rewards.filter(function(t){return t&&t.id}).map(function(t){return {id:String(t.id),e:String(t.e||"🎁"),t:String(t.t||""),c:Math.max(1,Math.round(+t.c)||1)}});
  if(s.days&&typeof s.days==="object") Object.keys(s.days).forEach(function(k){
    var x=s.days[k]; if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!x) return;
    var q={}; if(x.q&&typeof x.q==="object") SUBJ.forEach(function(sb){ if(x.q[sb.k]!=null) q[sb.k]=+x.q[sb.k]||0 });
    d.days[k]={done:x.done&&typeof x.done==="object"?x.done:{},stars:+x.stars||0,r:Array.isArray(x.r)?x.r.map(Boolean):[false,false,false],q:q};
  });
  d.banked=+s.banked||0; d.bonus=+s.bonus||0; d.spent=+s.spent||0;
  if(Array.isArray(s.red)) d.red=s.red.filter(function(x){return x&&x.id}).map(function(x){return {id:String(x.id),t:String(x.t||""),e:String(x.e||"🎁"),c:+x.c||0,d:String(x.d||""),st:x.st==="done"?"done":"wait"}});
  return d;
}

function pad(n){return n<10?"0"+n:""+n}
function keyOf(dt){return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate())}
function today(){return keyOf(new Date())}
function phase(){var h=new Date().getHours(); return h>=4&&h<12?"morning":h>=12&&h<19?"after":"night"}
function dayRec(k){return state.days[k]||{done:{},stars:0,r:[false,false,false],q:{}}}
function ensureDay(k){ if(!state.days[k]) state.days[k]={done:{},stars:0,r:[false,false,false],q:{}}; return state.days[k] }
function weekKey(){var n=new Date(),m=new Date(n); m.setDate(n.getDate()-((n.getDay()+6)%7)); return keyOf(m)}
function weekRec(k){return state.weeks[k]||{c:{},stars:0,full:false}}
function hwCount(w,x){return Math.min(x.n,+w.c[x.id]||0)}
function recomputeWeek(k){
  var w=state.weeks[k]; if(!w) return; var s=0,full=state.cfg.hw.length>0;
  state.cfg.hw.forEach(function(x){var n=hwCount(w,x); s+=n; if(n<x.n) full=false});
  if(full) s+=5; w.stars=s; w.full=full;
}
function recompute(k){
  var d=state.days[k]; if(!d) return; var s=0,r=[];
  ROUTINES.forEach(function(ro){var ts=state.cfg.tasks[ro.k],n=ts.filter(function(t){return d.done[t.id]}).length;
    s+=n; var full=ts.length>0&&n===ts.length; if(full) s+=2; r.push(full);});
  if(r[0]&&r[1]&&r[2]) s+=3;
  if(d.q) Object.keys(d.q).forEach(function(q){s+=+d.q[q]||0});
  d.stars=s; d.r=r;
}
function earned(){var s=state.banked+state.bonus; Object.keys(state.days).forEach(function(k){s+=state.days[k].stars||0});
  Object.keys(state.weeks).forEach(function(k){s+=state.weeks[k].stars||0}); return s}
function balance(){return Math.max(0,earned()-state.spent)}
function friendCount(){return Math.min(FRIENDS.length,Math.floor(earned()/state.cfg.unlockEvery)+1)}
function streak(){
  var d=new Date(),n=0; function ok(k){var x=state.days[k]; return x&&x.r&&(x.r[0]||x.r[1]||x.r[2])}
  if(!ok(keyOf(d))) d.setDate(d.getDate()-1);
  while(ok(keyOf(d))){n++; d.setDate(d.getDate()-1)} return n;
}
function prune(){
  var ks=Object.keys(state.days).sort(); while(ks.length>120){var k=ks.shift(); state.banked+=state.days[k].stars||0; delete state.days[k]}
  var ws=Object.keys(state.weeks).sort(); while(ws.length>26){var w=ws.shift(); state.banked+=state.weeks[w].stars||0; delete state.weeks[w]}
}

var docRef=null, writing=false, dirty=false, syncEl=document.getElementById("sync");
function setSync(t){syncEl.textContent=t}
function save(){
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  if(!docRef) return; dirty=true; pump();
}
function pump(){
  if(writing) return; writing=true;
  (function loop(retried){
    if(!dirty){writing=false; return}
    dirty=false;
    docRef.set(JSON.parse(JSON.stringify(state))).then(function(){setSync("다른 기기에서도 같은 기록이 보여요"); loop(false)},function(err){
      if(err&&err.code==="unavailable"&&!retried){dirty=true; setTimeout(function(){loop(true)},600+Math.random()*600)}
      else{writing=false; setSync("지금은 저장하지 못했어요. 이 기기에는 남아 있어요.")}
    });
  })(false);
}

  if(props) for(k in props){ if(k==="text") el.textContent=props[k]; else if(k.slice(0,2)==="on") el.addEventListener(k.slice(2),props[k]); else if(props[k]===true) el.setAttribute(k,""); else if(props[k]!==false&&props[k]!=null) el.setAttribute(k,props[k]); }
  for(i=2;i<arguments.length;i++){var c=arguments[i]; if(c==null) continue; el.appendChild(typeof c==="string"?document.createTextNode(c):c)}
  return el;
}

function chime(big){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); var t0=actx.currentTime;
    (big?[523,659,784,1047]:[784,1047]).forEach(function(f,i){var o=actx.createOscillator(),g=actx.createGain(); o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+i*0.09); g.gain.exponentialRampToValueAtTime(0.18,t0+i*0.09+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.09+0.3);
      o.connect(g); g.connect(actx.destination); o.start(t0+i*0.09); o.stop(t0+i*0.09+0.32)});

  var hs=h("section",null,h("h3",{text:"이번 주 숙제"}),h("p",{"class":"hint",text:"숫자는 일주일에 해야 하는 횟수예요 (1~7). 매주 월요일에 체크가 새로 시작돼요."}));

      h("button",{type:"button","class":"x","aria-label":"지우기",text:"✕",onclick:function(){state.cfg.rewards.splice(i,1); commit(); renderParent()}})));

    box,h("div",{"class":"row",style:"margin-top:8px"},
      h("button",{type:"button","class":"btn",text:"백업 내용 만들어 복사하기",onclick:function(){box.value=JSON.stringify(state); box.select();

      h("button",{type:"button","class":"btn ghost",text:"붙여 넣은 백업 불러오기",onclick:function(){

        if(!j||typeof j!=="object"||!j.cfg){msg.textContent="백업 내용이 올바르지 않아요."; return}
